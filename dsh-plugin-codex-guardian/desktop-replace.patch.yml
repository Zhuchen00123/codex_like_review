# For a desktop profile that already composes the official auto-review row.
# Install this package as a profile dependency/bundle first. Its bundle inserts
# the Guardian row; this profile layer only changes the row's configuration.
- id: auto-review
  disabled: true
- id: codex-guardian
  config:
    enabled: true
    usageGuard: true
    maxReviewsPerHour: 120
